name: README screenshots

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    name: Capture README screenshots
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Smoke
        shell: bash
        run: echo ok
