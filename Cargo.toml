[workspace]
members = ["crates/*"]
exclude = ["src-tauri"]
resolver = "2"

[profile.dev]
debug = 0
incremental = false

# The preview uses the same JPEG hot path as release builds.
[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[patch.crates-io]
xattr = { path = "third_party/xattr-0.2.3" }
