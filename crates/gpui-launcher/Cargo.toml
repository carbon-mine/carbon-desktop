[package]
name = "carbon-desktop-gpui"
version = "0.0.0"
edition = "2024"
publish = false
license = "MPL-2.0"

[dependencies]
anyhow = "1"
accesskit = "=0.25.2"
async-channel = "=2.5.0"
futures = "0.3"
carbon-account = { path = "../account" }
carbon-profiles = { path = "../profiles" }
carbon-pack = { path = "../pack" }
carbon-store = { path = "../store" }
carbon-session = { path = "../session" }
carbon-setup = { path = "../setup" }
carbon-runtime = { path = "../runtime" }
carbon-vanilla = { path = "../vanilla" }
gpui = "=0.2.2"
zune-core = "=0.5.3"
zune-jpeg = "=0.5.15"
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
gpui-component = "=0.5.1"
tempfile = "3"
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.17"

[target."cfg(windows)".dependencies]
accesskit_windows = "=0.35.2"
raw-window-handle = "0.6"
muda = { version = "=0.20.0", default-features = false }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_unix = "=0.24.1"
ashpd = { version = "=0.11.1", default-features = false, features = ["async-std"] }


[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
embed-resource = "3"
