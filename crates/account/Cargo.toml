[package]
name = "carbon-account"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
hex = "0.4"
open = "5.4.5"
sha2 = "0.11"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["serde"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
