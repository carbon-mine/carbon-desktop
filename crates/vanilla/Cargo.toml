[package]
name = "carbon-vanilla"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
carbon-profiles = { path = "../profiles" }
carbon-runtime = { path = "../runtime" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.11"
tempfile = "3"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls"] }
url = "2"
uuid = { version = "1", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
