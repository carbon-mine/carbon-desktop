[package]
name = "carbon-runtime"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
flate2 = "1"
hex = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json = "1"
