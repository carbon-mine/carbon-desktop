[package]
name = "carbon-pack"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
carbon-profiles = { path = "../profiles" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
